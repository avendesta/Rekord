name: Release

# Publishes a GitHub Release whenever MARKETING_VERSION in project.yml names a version that
# has no release yet. Pushes that don't change the version do nothing.
#
# With signing credentials in the `release` environment, the app is signed with a Developer ID,
# notarized by Apple and stapled. Without them, an unsigned (ad-hoc) build is released instead.
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: it builds, signs and
# notarizes, then uploads the zip as a workflow artifact and publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)
          [ -n "$version" ] || { echo "Could not read MARKETING_VERSION from project.yml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no release yet; building it."
          fi

  build:
    needs: check
    # A manual run always builds (as a dry run); a push builds only for a new version.
    if: needs.check.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    # The first notarization from a new Apple account can take hours; later ones take minutes.
    timeout-minutes: 300
    # Holds the signing secrets; only protected branches (main) may use this environment.
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check for signing credentials
        id: signing
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # No credentials at all: unsigned fallback. All four: signed. Anything in between is a
          # misconfiguration, and shipping an unsigned build by accident would be worse than failing.
          missing=""
          [ -n "$CERT" ] || missing="$missing DEVELOPER_ID_CERT_P12"
          [ -n "$CERT_PASSWORD" ] || missing="$missing DEVELOPER_ID_CERT_PASSWORD"
          [ -n "$NOTARY_APPLE_ID" ] || missing="$missing NOTARY_APPLE_ID"
          [ -n "$NOTARY_PASSWORD" ] || missing="$missing NOTARY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing credentials in the release environment; building an unsigned release."
          else
            echo "::error::Signing credentials are incomplete. Missing or empty secrets in the release environment:$missing"
            exit 1
          fi

      # ---- Signed and notarized build -------------------------------------------------------

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Make the temporary keychain the default so codesign and notarytool find it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Save the notarization credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          TEAM_ID=$(security find-identity -v -p codesigning | sed -n 's/.*Developer ID Application:.*(\([A-Z0-9]*\)).*/\1/p' | head -1)
          [ -n "$TEAM_ID" ] || { echo "No Developer ID Application identity was imported"; exit 1; }
          xcrun notarytool store-credentials ci-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD"

      - name: Build, sign, notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_PROFILE: ci-notary
        run: |
          scripts/release-signed.sh
          cp "build/signed/Rekord-$VERSION.zip" .
          shasum -a 256 "Rekord-$VERSION.zip" | cut -d' ' -f1 > sha256.txt

      # ---- Unsigned build (fallback when no credentials are configured) ---------------------

      - name: Build (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          xcodegen generate
          xcodebuild -project Rekord.xcodeproj -scheme Rekord -configuration Release \
            -derivedDataPath build/release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build

      - name: Package and verify (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          app=build/release/Build/Products/Release/Rekord.app
          built=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          [ "$built" = "$VERSION" ] || { echo "App reports $built, expected $VERSION"; exit 1; }
          archs=$(lipo -archs "$app/Contents/MacOS/Rekord")
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "Not universal: $archs"; exit 1 ;; esac
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "Rekord-$VERSION.zip"
          shasum -a 256 "Rekord-$VERSION.zip" | cut -d' ' -f1 > sha256.txt

      # ---- Release --------------------------------------------------------------------------

      - name: Write release notes
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          # This version's section of CHANGELOG.md, if there is one.
          awk -v v="$VERSION" 'index($0, "## " v) == 1 {found=1; next} /^## / {found=0} found' CHANGELOG.md > changes.md
          {
            if [ -s changes.md ]; then cat changes.md; else echo "Rekord $VERSION."; fi
            cat <<EOF

          ## Install
          1. Download \`Rekord-$VERSION.zip\` below and unzip it.
          2. Drag **Rekord** into Applications and open it.
          3. Allow **Microphone** and **System Audio Recording** when macOS asks.

          Requires **macOS 14.4 or later** (Apple silicon or Intel).
          EOF
            if [ "$SIGNED" = "true" ]; then
              cat <<EOF

          This build is signed with a Developer ID and notarized by Apple, so it opens without any security warning.
          EOF
            else
              cat <<EOF

          > **This build is not signed with an Apple Developer ID**, so macOS blocks it the first time ("Apple could not verify Rekord is free of malware"). Click **Done**, then open **System Settings > Privacy & Security**, click **Open Anyway** next to "Rekord was blocked", and confirm. Or run \`xattr -dr com.apple.quarantine /Applications/Rekord.app\` in Terminal. (On macOS 14 you can right-click Rekord and choose **Open** instead.)

          If recordings come out silent after updating, remove Rekord and add it again under System Settings > Privacy & Security > Microphone and Screen & System Audio Recording.
          EOF
            fi
            cat <<EOF

          See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for usage and troubleshooting.

          SHA-256 of \`Rekord-$VERSION.zip\`: \`$(cat sha256.txt)\`
          EOF
          } | sed 's/^          //' > notes.md

      - name: Create the release
        if: github.event_name == 'push'
        run: |
          gh release create "v$VERSION" "Rekord-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rekord $VERSION" \
            --notes-file notes.md \
            --latest

      - name: Upload the build (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: Rekord-${{ needs.check.outputs.version }}
          path: |
            Rekord-${{ needs.check.outputs.version }}.zip
            notes.md
          retention-days: 7

      - name: Remove the temporary keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
